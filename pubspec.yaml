name: msal_plus
description: MSAL+ — альтернативный клиент для lk.msal.ru
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Mail IMAP + SMTP
  enough_mail: ^2.1.0

  # Local Storage
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.5.1

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  intl: 0.20.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  flutter_widget_from_html_core: ^0.15.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # File handling
  file_picker: ^8.1.3

  # Utils
  shared_preferences: ^2.3.3

  # Secure storage (Android Keystore / iOS Keychain / Windows Credential Manager)
  flutter_secure_storage: ^9.2.4

  uuid: ^4.4.0

  # Utils (EWS XML, OWA crypto, HTTP)
  http: ^1.2.2
  xml: ^6.6.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

